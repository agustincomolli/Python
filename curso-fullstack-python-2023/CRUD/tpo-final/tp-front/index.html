<!DOCTYPE html>
<html>
<head>
    <title>Crear Producto</title>
    <style>
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
        }

        .form-group input[type="file"] {
            margin-top: 5px;
        }

        .btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Crear Producto</h1>
        <div id="message"></div>
        <form id="productForm">
            <div class="form-group">
                <label for="name">Nombre:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="price">Precio:</label>
                <input type="number" id="price" name="price" required>
            </div>
            <div class="form-group">
                <label for="stock">Stock:</label>
                <input type="number" id="stock" name="stock" required>
            </div>
            <div class="form-group">
                <label for="image">Imagen:</label>
                <input type="file" id="image" name="image" accept="image/*" required>
            </div>
            <button type="submit" class="btn">Crear</button>
        </form>
    </div>

    <script>
        document.getElementById('productForm').addEventListener('submit', function(e) {
            e.preventDefault();

            var form = e.target;
            var formData = new FormData(form);

            fetch('http://127.0.0.1:5000/products', {
                method: 'POST',
                body: formData
            })
            .then(function(response) {
                if (response.ok) {
                    document.getElementById('message').textContent = 'Producto creado exitosamente';
                    form.reset();
                } else {
                    document.getElementById('message').textContent = 'Error al crear el producto';
                }
            })
            .catch(function(error) {
                document.getElementById('message').textContent = 'Error de conexión';
            });
        });
    </script>
</body>
</html>
