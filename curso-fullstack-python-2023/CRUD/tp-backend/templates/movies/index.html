<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado Peliculas</title>
</head>

<body>

    <h1>Listado de Peliculas</h1>

    <table>
        <tr>
            <th>Id</th>
            <th>Titulo</th>
            <th>Duracion</th>
            <th>Fecha Alta</th>
            <th>Fecha Modificacion</th>
        </tr>
        {% for movie in jinja_html_movies%}
        <tr>
            <td>{{movie[0]}}</td>
            <td>{{movie[1]}}</td>
            <td>{{movie[2]}}</td>
            <td>{{movie[3]}}</td>
            <td>{{movie[4]}}</td>
        </tr>
        {% endfor %}
    </table>

</body>

</html>
